name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm --workspace backend run test
      - run: npm run build --workspaces
        env:
          # Agar `vite build` lolos tanpa backend hidup. Nilai ini memang
          # disamakan dengan URL produksi Railway; URL asli untuk deploy
          # diisi di dashboard Vercel (VITE_API_URL) lalu redeploy frontend.
          VITE_API_URL: https://modalin-api-production.up.railway.app
