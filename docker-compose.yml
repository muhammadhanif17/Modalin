services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: modalin
      MYSQL_USER: modalin
      MYSQL_PASSWORD: modalin
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: mysql://modalin:modalin@db:3306/modalin
      JWT_SECRET: replace-with-a-long-random-secret
      JWT_ISSUER: modalin-api
      JWT_AUDIENCE: modalin-web
      WEB_ORIGIN: http://localhost:5173
      API_PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
